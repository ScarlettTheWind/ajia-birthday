<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img" aria-label="一根粉色蜡烛的双层奶油蛋糕">
<defs><filter id="bc-shadow" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="7"/></filter><linearGradient id="bc-sponge" x2="0" y2="1"><stop stop-color="#E2CEB8"/><stop offset="1" stop-color="#CEB298"/></linearGradient><linearGradient id="bc-pink"><stop stop-color="#DDB8BE"/><stop offset=".45" stop-color="#F1D6D8"/><stop offset="1" stop-color="#D8AFB8"/></linearGradient></defs>
<style>
/* Three independent flame paths; container classes control the whole cake. */
#flame-group{transform-box:view-box;transform-origin:180px 100px}.bc-outer,.bc-middle,.bc-inner{transform-box:fill-box;transform-origin:50% 100%}.bc-outer{animation:bc-outer 2.3s ease-in-out infinite}.bc-middle{animation:bc-middle 1.8s ease-in-out -.6s infinite}.bc-inner{animation:bc-inner 1.4s ease-in-out -.3s infinite}@keyframes bc-outer{0%,100%{transform:rotate(-2deg);opacity:.78}50%{transform:rotate(3deg) scale(.97,1.035);opacity:.92}}@keyframes bc-middle{50%{transform:rotate(-2deg) scale(1.025,.96);opacity:.85}}@keyframes bc-inner{50%{transform:translateY(.6px) scale(.93,1.04);opacity:.75}}.windy #flame-group,.blowing #flame-group{animation:bc-wind .55s ease-in-out infinite}@keyframes bc-wind{0%,100%{transform:rotate(30deg) skewX(-8deg) scale(1.18,.88)}50%{transform:rotate(40deg) skewX(-12deg) scale(1.3,.8)}}.blown #flame-group{animation:none}.blown .bc-outer{animation:bc-off .48s ease-out forwards}.blown .bc-middle{animation:bc-off .38s ease-out forwards}.blown .bc-inner{animation:bc-off .28s ease-out forwards}@keyframes bc-off{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:translateY(2px) scale(.35,.15)}}.bc-smoke{opacity:0;transform-box:view-box;transform-origin:180px 100px}.blown .bc-smoke{animation:bc-smoke 2.8s ease-out .18s both}@keyframes bc-smoke{0%{opacity:0;transform:scale(.7,.55)}18%{opacity:.45}55%{opacity:.25;transform:translate(5px,-15px) scale(1.1)}100%{opacity:0;transform:translate(12px,-42px) scale(1.5,1.3)}}@media(prefers-reduced-motion:reduce){.bc-outer,.bc-middle,.bc-inner,.windy #flame-group{animation:none}.blown .bc-outer,.blown .bc-middle,.blown .bc-inner{animation:none;opacity:0}.blown .bc-smoke{animation:none;opacity:0}}
</style>
<!-- Tray and floating shadow. -->
<ellipse cx="180" cy="338" rx="126" ry="19" fill="#E5E3E0"/><ellipse cx="180" cy="334" rx="126" ry="17" fill="#EEEDE9"/><ellipse cx="180" cy="332" rx="96" ry="11" fill="#AAA09A" opacity=".24" filter="url(#bc-shadow)"/>
<!-- Tall lower tier and cream filling. -->
<path d="M72 234C73 224 287 224 288 234L287 297C287 325 74 325 73 297Z" fill="url(#bc-sponge)"/><path d="M74 268C126 287 235 286 287 267" fill="none" stroke="#F7ECDD" stroke-width="9" stroke-linecap="round"/><ellipse cx="180" cy="234" rx="108" ry="25" fill="#F7EDDB"/>
<g fill="#CDA5AA"><ellipse cx="94" cy="305" rx="8" ry="5"/><ellipse cx="123" cy="313" rx="8" ry="5"/><ellipse cx="155" cy="317" rx="8" ry="5"/><ellipse cx="189" cy="318" rx="8" ry="5"/><ellipse cx="223" cy="315" rx="8" ry="5"/><ellipse cx="256" cy="309" rx="8" ry="5"/><ellipse cx="277" cy="300" rx="7" ry="5"/></g>
<!-- Upper tier, with three irregular cream drips. -->
<path d="M102 168C103 157 257 157 258 168L257 226C257 251 103 251 103 226Z" fill="url(#bc-sponge)"/><path d="M105 204C145 218 217 218 255 203" fill="none" stroke="#F4E7D6" stroke-width="6" stroke-linecap="round"/><path d="M102 168C126 183 226 188 258 168L257 181C253 188 246 189 243 184L241 180C239 177 234 179 234 185L233 204C232 216 221 216 220 204L219 190C219 185 211 187 201 188C190 190 172 190 161 189C155 188 152 190 152 196L151 217C150 229 139 229 138 217L137 192C137 186 130 185 125 183C121 181 119 184 119 190L119 197C118 206 108 205 108 196L107 183C103 180 102 175 102 168Z" fill="#F7EDDB"/><ellipse cx="180" cy="168" rx="78" ry="20" fill="#FFF6E6"/>
<g fill="#CDA5AA"><ellipse cx="119" cy="164" rx="5" ry="4"/><ellipse cx="140" cy="155" rx="5" ry="4"/><ellipse cx="167" cy="152" rx="5" ry="4"/><ellipse cx="197" cy="153" rx="5" ry="4"/><ellipse cx="226" cy="158" rx="5" ry="4"/><ellipse cx="243" cy="168" rx="5" ry="4"/><ellipse cx="221" cy="180" rx="5" ry="4"/><ellipse cx="191" cy="184" rx="5" ry="4"/><ellipse cx="158" cy="182" rx="5" ry="4"/><ellipse cx="130" cy="176" rx="5" ry="4"/></g>
<g fill="#D9C394"><circle cx="151" cy="166" r="1.5"/><circle cx="165" cy="174" r="1.3"/><circle cx="207" cy="164" r="1.5"/><circle cx="218" cy="172" r="1.2"/></g><path d="M201 178C196 174 193 171 195 168C197 165 200 167 201 169C203 166 207 166 208 169C209 172 205 175 201 178Z" fill="#BB909A"/>
<!-- Candle, melted wax and separate wick. -->
<rect x="174" y="108" width="12" height="58" rx="3" fill="url(#bc-pink)"/><ellipse cx="180" cy="108" rx="6" ry="2.6" fill="#F7E4E3"/><path d="M174 109C177 112 178 109 179 111L179 120C179 124 183 124 183 120L183 111C184 112 186 111 186 109" fill="#F8E5E4"/><path id="candle-wick" d="M180 108Q178.8 103 180 99" fill="none" stroke="#806C66" stroke-width="1.8" stroke-linecap="round"/>
<g class="bc-smoke"><path d="M180 101C171 90 190 84 181 74C173 65 186 58 182 49" fill="none" stroke="#B9B5B1" stroke-width="2" stroke-linecap="round"/></g>
<g id="flame-group"><path class="bc-outer" d="M180 69C177 78 168 83 170 92C171 103 188 104 190 92C192 83 183 78 180 69Z" fill="#E8BA83"/><path class="bc-middle" d="M180 78C177 84 173 88 174 94C175 101 185 102 187 94C188 88 182 83 180 78Z" fill="#F3D49A"/><path class="bc-inner" d="M180 88C178 92 176 94 177 97C178 101 183 101 184 97C185 94 182 91 180 88Z" fill="#FFF0C7"/></g>
</svg>
